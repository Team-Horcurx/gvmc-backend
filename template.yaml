AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GVMC Change Detection API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        SECRET_NAME: !Ref SecretName
        GVMC_S3_BUCKET: !Ref GvmcS3Bucket

Parameters:
  SecretName:
    Type: String
    Default: gvmc/prod/secrets
  GvmcS3Bucket:
    Type: String
    Default: gvmc-sw14-data

Resources:
  GvmcApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gvmc-api
      Handler: lambda_function.handler
      CodeUri: .
      Description: GVMC main API handler
      Events:
        RestApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref GvmcApi
        OptionsApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: OPTIONS
            RestApiId: !Ref GvmcApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref GvmcS3Bucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:ap-south-1:${AWS::AccountId}:secret:${SecretName}*"
        - Statement:
          - Effect: Allow
            Action:
              - ssm:SendCommand
              - ssm:GetCommandInvocation
            Resource: "*"

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${GvmcApi}.execute-api.ap-south-1.amazonaws.com/prod/"
